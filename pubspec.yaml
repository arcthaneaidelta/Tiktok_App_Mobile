name: loopz
description: "A TikTok-style short video platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  video_player: ^2.9.3
  image_picker: ^1.1.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
